name: CI

# Builds rmw_zzdds against zzdds and runs its test suite. All the real logic
# lives in ci/build_and_test.py so it is runnable and debuggable locally in a
# ros:rolling container -- see ci/README.md.
#
# Two entry shapes:
#
#   * zzdds's CI calls this as a reusable workflow with mode "zzdds-pr" and the
#     zzdds commit under test -> the single `zzdds-pr` job below (one leg,
#     pinned ROS image, no dynamic matrix -- kept deliberately simple because
#     it gates zzdds PRs).
#
#   * rmw_zzdds's own pull_request / push / schedule / manual runs -> the
#     `setup-matrix` + `build-test` matrix over (zzdds ref) x (ROS image):
#       pr / push / manual : zzdds main, pinned ROS digest
#       schedule           : + a non-gating leg on the moving ros:rolling tag
#
# `mode` is a workflow_call input only. It is deliberately NOT also a
# workflow_dispatch input -- workflow_call inputs cannot be `type: choice`, and
# an input declared in both blocks with mismatched types makes the workflow
# fail to start on push / pull_request / schedule.
#
# NOTE: inside a reusable workflow `github.event_name` is the *caller's* event
# (never "workflow_call"), so the workflow_call path is detected by
# `inputs.mode` being non-empty, not by the event name.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: "pr | schedule | zzdds-pr"
        type: string
        default: zzdds-pr
      zzdds_repo:
        type: string
        default: zz-iot/zzdds
      zzdds_ref:
        description: "zzdds ref under test (mode zzdds-pr)"
        type: string
        default: ""
      rmw_zzdds_repo:
        type: string
        default: zz-iot/rmw_zzdds
      rmw_zzdds_ref:
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.zzdds_ref }}
  cancel-in-progress: true

jobs:
  # ── zzdds regression gate (called from zzdds CI) ─────────────────────────
  #
  # One leg, pinned image, no setup-matrix / fromJson. `container.image` is the
  # same pinned digest as ROS_ROLLING_DIGEST in ci/build_and_test.py -- keep
  # the two in sync when bumping (both are one line, reviewed together).
  zzdds-pr:
    name: zzdds-pr
    if: inputs.mode == 'zzdds-pr'
    runs-on: ubuntu-latest
    container:
      image: ros@sha256:6536553889f36066b3ecea5e46d80c31c6d70aa66edb5d396beb8c22248c3524
    steps:
      - name: Check out rmw_zzdds
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rmw_zzdds_repo }}
          # Empty inputs.rmw_zzdds_ref -> rmw_zzdds's default branch. Do NOT
          # fall back to github.sha here: in a called reusable workflow that
          # is the *caller's* (zzdds) commit, which is not a ref in this repo.
          ref: ${{ inputs.rmw_zzdds_ref }}
          path: rmw_zzdds
          persist-credentials: false

      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.zzdds_repo }}
          ref: ${{ inputs.zzdds_ref }}
          path: zzdds
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build rmw_zzdds and run its tests
        # --upstream-tests (the script default, spelled out here like --test):
        # also runs the upstream test_rmw_implementation conformance suites
        # against rmw_zzdds_cpp. Adds ~15-25 min. --no-upstream-tests drops it.
        run: |
          python3 rmw_zzdds/ci/build_and_test.py \
            --rmw-zzdds-src rmw_zzdds --zzdds-src zzdds \
            --ros-target digest \
            --workspace "${{ runner.temp }}/rmw-ci-ws" --jobs 4 --test --upstream-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-zzdds-test-results-zzdds-pr
          path: ${{ runner.temp }}/rmw-ci-ws/ros_ws/build/*/test_results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # ── rmw_zzdds's own PR / scheduled matrix ───────────────────────────────
  setup-matrix:
    name: Resolve matrix
    if: inputs.mode != 'zzdds-pr'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rmw_zzdds_repo || github.repository }}
          ref: ${{ inputs.rmw_zzdds_ref || github.sha }}
          persist-credentials: false

      - id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=schedule" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        run: |
          m=$(python3 ci/build_and_test.py --print-matrix "${{ steps.mode.outputs.mode }}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m"

  build-test:
    name: ${{ matrix.name }} / ${{ matrix.ros_target }}
    if: inputs.mode != 'zzdds-pr'
    needs: setup-matrix
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.ros_image }}
    continue-on-error: ${{ !matrix.gating }}
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'` guards the case where setup-matrix was skipped (zzdds-pr
        # mode): fromJson('') would error; an empty matrix just yields no legs.
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix || '[]') }}

    steps:
      - name: Check out rmw_zzdds
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rmw_zzdds_repo || github.repository }}
          ref: ${{ inputs.rmw_zzdds_ref || github.sha }}
          path: rmw_zzdds
          persist-credentials: false

      - name: Check out zzdds
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.zzdds_repo || 'zz-iot/zzdds' }}
          ref: ${{ matrix.zzdds_ref }}
          path: zzdds
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build rmw_zzdds and run its tests
        # --upstream-tests (the script default, spelled out here like --test):
        # also runs the upstream test_rmw_implementation conformance suites
        # against rmw_zzdds_cpp. Adds ~15-25 min. --no-upstream-tests drops it.
        run: |
          python3 rmw_zzdds/ci/build_and_test.py \
            --rmw-zzdds-src rmw_zzdds --zzdds-src zzdds \
            --ros-target "${{ matrix.ros_target }}" \
            --workspace "${{ runner.temp }}/rmw-ci-ws" --jobs 4 --test --upstream-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-zzdds-test-results-${{ matrix.name }}-${{ matrix.ros_target }}
          path: ${{ runner.temp }}/rmw-ci-ws/ros_ws/build/*/test_results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Stable name for branch protection / the zzdds caller to gate on. Exactly
  # one path runs per trigger (zzdds-pr, or setup-matrix + build-test); the
  # other is `skipped`. Passes only when no leg failed/was cancelled AND a
  # real test path actually executed -- so a setup-matrix failure (which
  # skips build-test) cannot masquerade as green.
  result:
    name: rmw_zzdds CI result
    needs: [zzdds-pr, setup-matrix, build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          z='${{ needs.zzdds-pr.result }}'
          s='${{ needs.setup-matrix.result }}'
          b='${{ needs.build-test.result }}'
          echo "zzdds-pr=$z  setup-matrix=$s  build-test=$b"
          for r in "$z" "$s" "$b"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::leg concluded '$r'"; exit 1 ;;
            esac
          done
          if [ "$z" = skipped ] && [ "$b" = skipped ]; then
            echo "::error::no test path executed (zzdds-pr and build-test both skipped)"
            exit 1
          fi
